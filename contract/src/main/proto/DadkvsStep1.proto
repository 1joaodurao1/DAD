//
// Protocol buffers definition for Dadkvs Step 1 Service
//
syntax = "proto3";
package dadkvs;

message DefineOrderRequest {
  int32 nextReqid = 1;
  int32 seqNumber = 2;
}

message DefineOrderReply{}



service DadkvsStep1Service {
  rpc defineOrder (DefineOrderRequest) returns (DefineOrderReply);
}






